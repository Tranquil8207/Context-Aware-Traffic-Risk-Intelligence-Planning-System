<script>
window.addEventListener('load', function() {

    var poiPoints = [];

    function onMapClick(e) {
        var type = prompt("Enter POI type (school / office / industrial):", "school");
        if (type === null || type.trim() === "") return;
        type = type.trim().toLowerCase();

        var color = "blue";
        if (type === "school") color = "red";
        else if (type === "office") color = "green";
        else if (type === "industrial") color = "orange";

        var marker = L.circleMarker(e.latlng, {
            radius: 8,
            color: color,
            fillColor: color,
            fillOpacity: 0.8
        }).addTo(map_0a74e632d07f575338e65421dd628c2f);

        marker.bindPopup(type + "<br>" + e.latlng.lat.toFixed(6) + ", " + e.latlng.lng.toFixed(6)).openPopup();

        poiPoints.push({lat: e.latlng.lat, lng: e.latlng.lng, type: type});

        document.getElementById("poi-count").innerText = "Points selected: " + poiPoints.length;
    }

    map_0a74e632d07f575338e65421dd628c2f.on('click', onMapClick);

    window.downloadPOIs = function() {
        var dataStr = JSON.stringify(poiPoints, null, 2);
        var blob = new Blob([dataStr], {type: "application/json"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = "poi_selections.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };

    window.undoLast = function() {
        if (poiPoints.length === 0) return;
        poiPoints.pop();
        alert("Removed last point from the list. Refresh the page and re-click all points if you want the map markers to match exactly.");
        document.getElementById("poi-count").innerText = "Points selected: " + poiPoints.length;
    };

});
</script>

<div style="position:fixed;top:10px;right:10px;z-index:9999;background:white;padding:12px;border:2px solid #333;border-radius:6px;font-family:sans-serif;">
    <b>POI Picker</b><br>
    Click on the map to add a point.<br>
    You'll be asked to type: school / office / industrial<br><br>
    <div id="poi-count">Points selected: 0</div><br>
    <button onclick="downloadPOIs()" style="padding:8px;margin-right:5px;">Download JSON</button>
    <button onclick="undoLast()" style="padding:8px;">Undo Last</button>
